services:
  - type: web
    name: viralizer-video-studio-beta
    runtime: docker
    plan: free
    branch: develop
    healthCheckPath: /health
    envVars:
      - key: APP_ENVIRONMENT
        value: private-beta
      - key: APP_VERSION
        value: v1.1.0-beta.8
      - key: APP_PASSWORD
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: GITHUB_REPOSITORY
        value: ahameddon-dot/viralizer-video-studio
      - key: GITHUB_DEPLOY_TOKEN
        sync: false
      - key: MCP_SERVER_URL
        value: https://mcp.viralizer.ai/mcp
      - key: MCP_TOOL_NAME
        value: analyze_topic
      - key: MCP_TOPIC_ARGUMENT
        value: keyword
      - key: MCP_API_KEY
        sync: false
      - key: PIXVERSE_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_IMAGE_MODEL
        value: gpt-image-2
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: CLOUDFLARE_IMAGE_MODEL
        value: "@cf/leonardo/lucid-origin"
      - key: APP_DATA_DIR
        value: /tmp/viralizer-beta-data
      - key: DAILY_TRENDS_ENABLED
        value: "false"
