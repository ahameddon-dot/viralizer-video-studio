<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create my concept · Viralizer</title><style>:root{--bg:#0b0a12;--card:#15131e;--line:#3c3650;--violet:#9b43ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#2d1554,#09080d 60%);color:#fff;font-family:Inter,system-ui}.top{height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 max(24px,calc((100% - 1120px)/2));border-bottom:1px solid var(--line)}.top img{width:160px}.top nav{display:flex;gap:18px}.top a{color:#ddd;text-decoration:none;font-weight:800;font-size:14px}main{width:min(1040px,calc(100% - 32px));margin:42px auto}.eyebrow{color:#d5a8ff;font-size:12px;font-weight:900;letter-spacing:.12em}h1{font-size:clamp(38px,6vw,64px);line-height:1;margin:10px 0}p{color:#bdb5ca;line-height:1.5}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:18px}.card{padding:24px;border:1px solid var(--line);border-radius:22px;background:var(--card)}label{display:grid;gap:8px;margin:15px 0;font-weight:800;font-size:13px}input,textarea,select{width:100%;border:1px solid #4c4561;border-radius:12px;background:#0d0c13;color:#fff;padding:13px;font:inherit}textarea{min-height:120px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}button,.button{border:0;border-radius:12px;padding:13px 17px;background:linear-gradient(135deg,#7e2df2,#bd58ff);color:#fff;font-weight:900;cursor:pointer;text-decoration:none}.secondary{background:#24202e;border:1px solid #514a63}.status{margin-top:14px;color:#bdeccb;font-weight:750}.video{width:100%;border-radius:16px;background:#000;max-height:600px}.hidden{display:none}@media(max-width:760px){.grid,.row{grid-template-columns:1fr}}</style></head><body><header class="top"><a href="/creatorthon-v3"><img src="/static/viralizer-logo-white.png" alt="Viralizer"></a><nav><a href="/creatorthon/workspace">My Workspace</a><a href="/creatorthon-v3">Topic creator</a></nav></header><main><span class="eyebrow">BLANK CANVAS CREATOR</span><h1>Create from your own concept.</h1><p>Describe the story you want to make. Viralizer turns it into a production prompt, narration, and finished video.</p><div class="grid"><section class="card"><label>Concept title<input id="title" placeholder="Example: New collection launch"></label><label>What should the viewer see?<textarea id="concept" placeholder="Example: Start with a close-up of silk moving in light, reveal the new scarf in a street-style look, then end on a confident full-frame hero moment."></textarea></label><div class="actions"><button id="build">Create Viralizer prompt</button></div><label>Video prompt<textarea id="prompt" placeholder="Your optimized prompt appears here."></textarea></label><label>Narration script<textarea id="narration" placeholder="Narration appears here and remains editable."></textarea></label></section><aside class="card"><div class="row"><label>Provider<select id="provider"><option value="pixverse">PixVerse</option><option value="heygen">HeyGen</option></select></label><label>Voice<select id="voice"><option value="coral">Coral</option><option value="alloy">Alloy</option><option value="nova">Nova</option></select></label><label>Duration<select id="duration"><option value="5">5 seconds</option><option value="10" selected>10 seconds</option><option value="15">15 seconds</option></select></label><label>Format<select id="format"><option value="9:16">Vertical 9:16</option><option value="16:9">Landscape 16:9</option><option value="1:1">Square 1:1</option></select></label></div><label>Background (optional)<input id="background" placeholder="No preference"></label><label>Face / presenter (optional)<select id="face"><option value="">No preference</option><option>Female</option><option>Male</option><option>No person</option></select></label><label>Appearance (optional)<select id="appearance"><option value="">No preference</option><option>Indian</option><option>American</option><option>Chinese</option><option>Global</option></select></label><label>Official logo (optional)<input id="logo" type="file" accept="image/png,image/jpeg,image/webp"></label><label><input id="speech" type="checkbox" checked style="width:auto"> Add narration as speech</label><div class="actions"><button id="generate">Review & generate video</button></div><div id="status" class="status"></div><video id="video" class="video hidden" controls playsinline></video><div id="links" class="actions hidden"></div></aside></div></main><script>const $=s=>document.querySelector(s);let content={},projectId='',logo='';async function api(url,o={}){const {timeoutMs=20000,...request}=o,controller=new AbortController,timeout=setTimeout(()=>controller.abort(),timeoutMs);try{const r=await fetch(url,{headers:{'Content-Type':'application/json',...(request.headers||{})},signal:controller.signal,...request}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||'Something went wrong');return d}catch(e){if(e.name==='AbortError')throw Error('This step is still taking longer than expected. No duplicate video was started. Please try again.');throw e}finally{clearTimeout(timeout)}}const status=t=>$('#status').textContent=t;$('#logo').onchange=async e=>{const f=e.target.files[0];logo=f?await new Promise((ok,no)=>{const r=new FileReader;r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)}):''};$('#build').onclick=async()=>{const idea=$('#concept').value.trim(),title=$('#title').value.trim()||'My video concept';if(!idea)return status('Describe your concept first.');status('Creating your Viralizer prompt…');content={title,topic:title,summary:idea,creator_angle:idea,video_idea:idea};try{const d=await api('/api/video/prompt',{method:'POST',body:JSON.stringify({content,provider:$('#provider').value,duration:+$('#duration').value,quality:'720p',quality_mode:false,allow_standard_fallback:true,aspect_ratio:$('#format').value,prompt:idea})});content=d.content||content;$('#prompt').value=d.prompt||idea;$('#narration').value=d.narration||d.heygen_script||'';status('Prompt and narration ready. Review, then generate.')}catch(e){status(e.message)}};$('#generate').onclick=async()=>{if(!$('#prompt').value.trim())return status('Create or enter a prompt first.');try{status('Saving your concept…');const config={background:$('#background').value.trim(),face:$('#face').value,appearance:$('#appearance').value};const visual=[config.background&&'Background: '+config.background,config.face&&'Human subject: '+config.face,config.appearance&&'Appearance: '+config.appearance].filter(Boolean).join('\n');const finalPrompt=$('#prompt').value+(visual?'\n\nConfirmed visual configuration:\n'+visual:'');if(!window.confirm('Review before generation:\n\nProvider: '+$('#provider').value+'\nDuration: '+$('#duration').value+' seconds\nVoice: '+($('#speech').checked?$('#voice').value:'No speech')+'\n\nFinal prompt:\n'+finalPrompt))return;const p=await api('/api/creatorthon/projects',{method:'POST',body:JSON.stringify({topic:{title:$('#title').value.trim()||content.title||'My video concept',topic:$('#title').value.trim()||content.topic||'My video concept',summary:$('#concept').value.trim(),creator_angle:$('#concept').value.trim(),video_idea:$('#concept').value.trim()},provider:$('#provider').value,prompt:{text:finalPrompt,concept:$('#concept').value},narration:{text:$('#narration').value,voice:$('#voice').value},configuration:config,aspect_ratio:$('#format').value,quality:'720p'}),timeoutMs:35000});projectId=p.id;status('Starting your '+($('#provider').value==='heygen'?'HeyGen':'PixVerse')+' video…');const d=await api('/api/video/generate,{method:'POST',body:JSON.stringify({content,creator_concept:true,provider:$('#provider').value,prompt:finalPrompt,duration:+$('#duration').value,quality:'720p',quality_mode:false,allow_standard_fallback:true,aspect_ratio:$('#format').value,narration:$('#speech').checked?$('#narration').value:'',background:config.background}),timeoutMs:90000});const recovery={projectId,provider:d.provider,jobId:d.job_id,narration:$('#speech').checked?$('#narration').value:'',voice:$('#voice').value,logo};localStorage.setItem('viralizerConceptRecovery',JSON.stringify(recovery));await api('/api/creatorthon/projects/'+projectId,{method:'PATCH',body:JSON.stringify({job_id:d.job_id,provider:d.provider,status:'processing'})});for(let i=0;i<120;i++){await new Promise(r=>setTimeout(r,4000));const x=await api('/api/video/'+encodeURIComponent(d.provider)+'/'+encodeURIComponent(d.job_id));status(x.stage||'Generating your video…');const raw=x.video_url||x.url||x.output_url;if(raw){recovery.rawUrl=raw;localStorage.setItem('viralizerConceptRecovery',JSON.stringify(recovery));await api('/api/creatorthon/projects/'+projectId,{method:'PATCH',body:JSON.stringify({status:'post-production',production:{provider:d.provider,job_id:d.job_id,raw_video_url:raw}})}).catch(()=>{});const f=await api('/api/creatorthon/finish-async,{method:'POST',body:JSON.stringify({video_url:raw,narration:$('#speech').checked?$('#narration').value:'',voice:$('#voice').value,official_logo_data:logo,project_id:projectId,provider:d.provider,provider_job_id:d.job_id})});for(let j=0;j<180;j++){await new Promise(r=>setTimeout(r,2000));const q=await api('/api/creatorthon/finish-async/'+f.job_id);status(q.stage||'Finishing your video…');if(q.status==='completed'){await api('/api/creatorthon/projects/'+projectId,{method:'PATCH',body:JSON.stringify({video_url:q.url,status:'completed'})});$('#video').src=q.url;$('#video').classList.remove('hidden');$('#links').innerHTML='<a class="button" target="_blank" href="'+q.url+'">Open video</a><a class="button secondary" target="_blank" href="/api/creatorthon/projects/'+projectId+'/share">Share video</a>';$('#links').classList.remove('hidden');localStorage.removeItem('viralizerConceptRecovery');return}if(q.status==='failed')throw Error(q.error)}}if(['failed','error','cancelled','canceled'].includes(String(x.status).toLowerCase()))throw Error(x.error||'Video generation failed')}throw Error('The project is still processing. Open it from My Workspace later.')}catch(e){status(e.message);window.offerConceptRecovery&&window.offerConceptRecovery()}};</script><script>window.offerConceptRecovery=()=>{const saved=localStorage.getItem('viralizerConceptRecovery');if(!saved)return;const links=$('#links');links.innerHTML='<button type="button" class="secondary" id="recoverConcept">Retry saving completed video</button>';links.classList.remove('hidden');$('#recoverConcept').onclick=window.recoverConceptVideo};window.recoverConceptVideo=async()=>{let saved;try{saved=JSON.parse(localStorage.getItem('viralizerConceptRecovery')||'{}')}catch{return}if(!saved.jobId||!saved.provider)return;status('Recovering your completed PixVerse video — no new video is being generated…');try{let raw=saved.rawUrl;for(let i=0;!raw&&i<30;i++){const state=await api('/api/video/'+encodeURIComponent(saved.provider)+'/'+encodeURIComponent(saved.jobId),{timeoutMs:30000});raw=state.video_url||state.url||state.output_url;if(!raw)await new Promise(r=>setTimeout(r,3000))}if(!raw)throw Error('PixVerse is still making the completed file available. Keep this page open and retry saving shortly; no new credit will be used.');saved.rawUrl=raw;localStorage.setItem('viralizerConceptRecovery',JSON.stringify(saved));if(saved.projectId)await api('/api/creatorthon/projects/'+saved.projectId,{method:'PATCH',body:JSON.stringify({status:'post-production',production:{provider:saved.provider,job_id:saved.jobId,raw_video_url:raw}})}).catch(()=>{});const started=await api('/api/creatorthon/finish-async',{method:'POST',body:JSON.stringify({video_url:raw,narration:saved.narration||'',voice:saved.voice||'coral',official_logo_data:saved.logo||'',project_id:saved.projectId||'',provider:saved.provider||'',provider_job_id:saved.jobId||''}),timeoutMs:30000});for(let i=0;i<180;i++){await new Promise(r=>setTimeout(r,2000));const result=await api('/api/creatorthon/finish-async/'+encodeURIComponent(started.job_id),{timeoutMs:30000});status(result.stage||'Finishing your completed video…');if(result.status==='completed'&&result.url){if(saved.projectId)await api('/api/creatorthon/projects/'+saved.projectId,{method:'PATCH',body:JSON.stringify({video_url:result.url,status:'completed'})}).catch(()=>{});$('#video').src=result.url;$('#video').classList.remove('hidden');$('#links').innerHTML='<a class="button" target="_blank" href="'+result.url+'">Open video</a><a class="button secondary" target="_blank" href="/api/creatorthon/projects/'+saved.projectId+'/share">Share video</a>';localStorage.removeItem('viralizerConceptRecovery');return}if(result.status==='failed')throw Error(result.error||'The completed video could not be saved yet.')}throw Error('Video finishing is still in progress. Retry saving later; no new video will be generated.')}catch(e){status(e.message);window.offerConceptRecovery()}};window.offerConceptRecovery();</script></body></html>
