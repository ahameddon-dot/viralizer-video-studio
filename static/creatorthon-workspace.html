<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Workspace · Viralizer</title><style>
:root{--ink:#111116;--muted:#71717a;--line:#e7e7ec;--soft:#f6f6f8;--violet:#8b2cff;--green:#39d990}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:#fafafd}button{font:inherit;cursor:pointer}.top{height:72px;border-bottom:1px solid var(--line);background:#fffc;backdrop-filter:blur(16px);display:flex;align-items:center;justify-content:space-between;padding:0 max(24px,calc((100vw - 1120px)/2));position:sticky;top:0;z-index:5}.top img{width:158px;display:block}.top nav{display:flex;gap:18px;align-items:center}.top a{color:#55545d;text-decoration:none;font-weight:750;font-size:14px}.create{padding:11px 16px!important;border-radius:12px;background:#111;color:#fff!important}main{width:min(1120px,calc(100% - 40px));margin:auto;padding:42px 0 80px}.eyebrow{color:var(--violet);font-size:12px;font-weight:900;letter-spacing:.12em}.hero{display:flex;align-items:end;justify-content:space-between;gap:24px;margin-bottom:30px}.hero h1{font-size:clamp(40px,5vw,62px);letter-spacing:-.055em;line-height:1;margin:9px 0}.hero p{color:var(--muted);margin:0}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:32px}.metric{padding:20px;border:1px solid var(--line);border-radius:18px;background:#fff}.metric strong{display:block;font-size:28px}.metric span{color:var(--muted);font-size:13px}.tabs{display:flex;gap:8px;margin-bottom:18px}.tab{padding:11px 15px;border:1px solid var(--line);border-radius:999px;background:#fff;font-weight:800}.tab.on{background:#111;color:#fff;border-color:#111}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{display:flex;flex-direction:column;min-height:270px;border:1px solid var(--line);border-radius:21px;overflow:hidden;background:#fff}.thumb{height:135px;background:linear-gradient(135deg,#18131f,#7b23d0);display:grid;place-items:center;color:#fff;font-size:42px}.thumb video{width:100%;height:100%;object-fit:cover;background:#000}.body{display:flex;flex:1;flex-direction:column;padding:18px}.status{align-self:start;padding:6px 9px;border-radius:99px;background:#f0e7ff;color:#7020ca;font-size:10px;font-weight:900;text-transform:uppercase}.body h2{font-size:18px;line-height:1.25;margin:13px 0 8px}.body p{color:var(--muted);font-size:13px;line-height:1.45;margin:0}.meta{margin-top:auto;padding-top:15px;color:#8a8990;font-size:11px}.actions{display:flex;gap:8px;margin-top:13px}.actions a,.actions button{flex:1;padding:10px;border:1px solid var(--line);border-radius:11px;background:#fff;color:#111;text-align:center;text-decoration:none;font-weight:800;font-size:12px}.actions .primary{background:#111;color:#fff}.actions .youtube{border-color:#ff2d2d;background:#ff2d2d;color:#fff}.youtube-url{display:block;margin-top:8px;color:#0b5bd3;font-size:11px;font-weight:750;line-height:1.35;overflow-wrap:anywhere}.actions .danger{border-color:#ffd3da;background:#fff5f6;color:#b4233d}.actions .danger:hover{background:#ffe8ec}.empty{grid-column:1/-1;padding:56px;border:1px dashed #d4d3dc;border-radius:22px;text-align:center;color:var(--muted)}.error{display:none;margin-bottom:20px;padding:14px;border-radius:12px;background:#fff0f2;color:#a21f39}.error.show{display:block}.success{display:none;margin-bottom:20px;padding:14px;border-radius:12px;background:#eafbf2;color:#17653c}.success.show{display:block}.success a{color:#0b5bd3;font-weight:850;overflow-wrap:anywhere}@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}.summary{grid-template-columns:1fr 1fr}}@media(max-width:560px){.top{padding:0 16px}.top img{width:135px}.top nav a:not(.create){display:none}main{width:calc(100% - 28px);padding-top:28px}.hero{display:block}.summary,.grid{grid-template-columns:1fr}.metric{padding:16px}}
.card{min-height:510px}.thumb{height:190px;flex:0 0 190px;overflow:hidden;position:relative}.body{position:relative;z-index:1;background:#fff}.body h2{display:-webkit-box;min-height:45px;overflow:hidden;-webkit-box-orient:vertical;-webkit-line-clamp:2}.body>p{display:-webkit-box;min-height:38px;overflow:hidden;-webkit-box-orient:vertical;-webkit-line-clamp:2}.meta{margin-top:14px}.card-actions{margin-top:auto}.publish-actions{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;margin-top:10px}.publish-actions .youtube{display:flex;align-items:center;justify-content:center;padding:11px;border:1px solid #ff2d2d;border-radius:11px;background:#ff2d2d;color:#fff;text-align:center;text-decoration:none;font-weight:850;font-size:12px}.copy-link{padding:10px 12px!important;white-space:nowrap}.destructive-actions{padding-top:12px;border-top:1px solid var(--line)}.destructive-actions .danger{padding:8px;font-size:11px}.published-note{margin-top:8px;color:#777680;font-size:11px;text-align:center}@media(max-width:560px){.card{min-height:0}.publish-actions{grid-template-columns:1fr}}
</style></head><body><header class="top"><a id="workspaceLogo" href="/creatorthon/workspace" aria-label="Viralizer home"><img src="/static/viralizer-logo-black.png" alt="Viralizer"></a><nav><a id="workspaceConceptLink" href="/creatorthon/concept" hidden>Create my concept</a><a href="/logout?next=/">Sign out</a><a id="createNewLink" class="create" href="/">+ Create new</a></nav></header><main><div id="error" class="error"></div><div id="success" class="success"></div><div class="hero"><div><span class="eyebrow">YOUR ACCOUNT</span><h1>My Workspace</h1><p id="welcome">Your drafts, videos and reports—saved in one place.</p></div></div><div id="summary" class="summary"></div><div class="tabs"><button class="tab on" data-view="projects">All projects</button><button class="tab" data-view="videos">My videos</button><button class="tab" data-view="drafts">Drafts</button><button class="tab" data-view="reports">Reports</button></div><section id="grid" class="grid"><div class="empty">Loading your workspace…</div></section></main><script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];let data={projects:[],reports:[],summary:{}},currentView='projects';const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const title=p=>p.title||p.topic?.title||p.topic?.topic||'Untitled project';const date=v=>v?new Date(v*1000).toLocaleString():'Recently';
async function api(url,options={}){const r=await fetch(url,{credentials:'same-origin',...options,headers:{'Content-Type':'application/json',...(options.headers||{})}}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||'Could not update your workspace.');return d}
const isV3Host=location.hostname.toLowerCase()==='v3.viralizer.ai',creationHome=isV3Host?'/':'/creatorthon';$('#workspaceLogo').href=creationHome;$('#createNewLink').href=creationHome;
async function showParticipantBadge(){try{const event=await api('/api/creatorthon/event-status'),nav=document.querySelector('.top nav'),badge=document.createElement('span');badge.id='participantBadge';badge.textContent=event.participant_label;badge.style.cssText='padding:8px 11px;border:1px solid #d9c8ef;border-radius:999px;background:#f5edff;color:#7020ca;font-size:11px;font-weight:850;white-space:nowrap';nav?.prepend(badge);$('#workspaceConceptLink').hidden=!(event.admin||event.unlimited);if(event.admin&&!document.querySelector('#adminLink')){const link=document.createElement('a');link.id='adminLink';link.href='/creatorthon/admin';link.textContent='Admin';nav?.prepend(link)}}catch(e){$('#workspaceConceptLink').hidden=true}}
showParticipantBadge();
async function showYouTubeConnection(){try{const status=await api('/api/creatorthon/youtube/status'),old=$('#youtubeAccountControl');old?.remove();const control=document.createElement('span');control.id='youtubeAccountControl';control.style.cssText='display:flex;align-items:center;gap:6px;white-space:nowrap';if(status.connected){const channel=document.createElement('span');channel.textContent='YouTube: '+status.channel_title;channel.style.cssText='color:#55545d;font-weight:750;font-size:13px';const disconnect=document.createElement('button');disconnect.textContent='×';disconnect.title='Disconnect YouTube';disconnect.style.cssText='border:0;background:transparent;color:#b4233d;font-weight:900;padding:2px';disconnect.onclick=async()=>{if(confirm('Disconnect '+status.channel_title+' from Viralizer?')){await api('/api/creatorthon/youtube/disconnect',{method:'POST'});showYouTubeConnection()}};control.append(channel,disconnect)}else{const connect=document.createElement('a');connect.href='/auth/youtube/connect';connect.textContent='Connect YouTube';control.append(connect)}document.querySelector('.top nav')?.prepend(control)}catch(e){}}
showYouTubeConnection();
const youtubeOAuthResult=new URLSearchParams(location.search).get('youtube');if(youtubeOAuthResult==='connected'){$('#success').textContent='Your YouTube account is connected. New uploads will publish to your account.';$('#success').classList.add('show')}else if(youtubeOAuthResult){$('#error').textContent=youtubeOAuthResult==='denied'?'YouTube connection was cancelled.':'YouTube could not be connected. Confirm the OAuth redirect URI and try again.';$('#error').classList.add('show')}
function metrics(){const s=data.summary||{};$('#summary').innerHTML=[['Projects',s.projects||0],['Finished videos',s.completed_videos||0],['Drafts',s.drafts||0],['Reports',s.reports||0]].map(x=>'<div class="metric"><strong>'+x[1]+'</strong><span>'+x[0]+'</span></div>').join('')}
function projectCard(p){const video=p.video_url?'<video src="'+esc(p.video_url)+'" muted preload="metadata"></video>':'<span>▶</span>',prompt=p.prompt?.text||p.prompt?.prompt||'',youtube=p.production?.published?.youtube||{},youtubePublished=youtube.status==='published',youtubeUrl=youtube.url||(youtube.id?'https://youtu.be/'+encodeURIComponent(youtube.id):''),continueUrl=creationHome+(creationHome.includes('?')?'&':'?')+'project='+encodeURIComponent(p.id);return '<article class="card"><div class="thumb">'+video+'</div><div class="body"><span class="status">'+esc(p.status||'draft')+'</span><h2>'+esc(title(p))+'</h2><p>'+esc(prompt||p.topic?.description||'Continue this saved creation when you are ready.')+'</p><div class="meta">'+esc(p.provider||'Provider not selected')+' · '+esc(date(p.updated_at))+'</div><div class="card-actions"><div class="actions">'+(p.video_url?'<a class="primary" href="'+esc(p.video_url)+'" target="_blank" rel="noopener">Watch video</a>':'<a class="primary" href="'+esc(continueUrl)+'">Continue</a>')+'<button onclick="details(\''+esc(p.id)+'\')">Details</button></div>'+(p.video_url?'<div class="publish-actions">'+(youtubePublished&&youtubeUrl?'<a class="youtube" href="'+esc(youtubeUrl)+'" target="_blank" rel="noopener">View on YouTube ↗</a><button class="copy-link" onclick="copyYouTube(\''+esc(p.id)+'\',this)">Copy link</button>':'<button class="youtube" '+(youtubePublished?'disabled':'onclick="publishYouTube(\''+esc(p.id)+'\',this)"')+'>'+(youtubePublished?'Published to YouTube ✓':'Publish to YouTube')+'</button>')+'</div>'+(youtubePublished&&youtubeUrl?'<div class="published-note">Published successfully on YouTube</div>':''):'')+'<div class="actions destructive-actions">'+(p.video_url?'<button class="danger" onclick="deleteVideo(\''+esc(p.id)+'\')">Delete video</button>':'')+'<button class="danger" onclick="deleteProject(\''+esc(p.id)+'\')">Delete project</button></div></div></div></article>'}
function reportCard(r){const summary=typeof r.content?.summary==='string'?r.content.summary:(r.content?.core_message||'Saved topic research and production intelligence.');return '<article class="card"><div class="thumb">▤</div><div class="body"><span class="status">'+esc(r.report_type)+'</span><h2>'+esc(r.title)+'</h2><p>'+esc(summary)+'</p><div class="meta">'+esc(date(r.updated_at))+'</div><div class="actions">'+(r.source_url?'<a href="'+esc(r.source_url)+'" target="_blank" rel="noopener">Source</a>':'')+'<button class="primary" onclick="reportDetails(\''+esc(r.id)+'\')">Open report</button></div></div></article>'}
function render(view=currentView){currentView=view;let items=[];if(view==='reports')items=data.reports.map(reportCard);else{let projects=data.projects;if(view==='videos')projects=projects.filter(p=>p.video_url);if(view==='drafts')projects=projects.filter(p=>['draft','prepared'].includes(p.status));items=projects.map(projectCard)}$('#grid').innerHTML=items.join('')||'<div class="empty">Nothing saved here yet. Start a new creation and Viralizer will autosave it.</div>'}
function details(id){const p=data.projects.find(x=>x.id===id);if(!p)return;alert([title(p),'Status: '+p.status,'Provider: '+(p.provider||'Not selected'),'Prompt: '+(p.prompt?.text||p.prompt?.prompt||'Not prepared yet')].join('\n\n'))}function reportDetails(id){const r=data.reports.find(x=>x.id===id);if(r)alert(r.title+'\n\n'+JSON.stringify(r.content,null,2))}
async function refreshWorkspace(){data=await api('/api/creatorthon/workspace');metrics();render(currentView)}
async function copyYouTube(id,button){const p=data.projects.find(x=>x.id===id),youtube=p?.production?.published?.youtube||{},url=youtube.url||(youtube.id?'https://youtu.be/'+encodeURIComponent(youtube.id):'');if(!url)return;try{await navigator.clipboard.writeText(url);button.textContent='Copied ✓';setTimeout(()=>button.textContent='Copy link',1800)}catch(e){window.prompt('Copy YouTube URL:',url)}}
async function publishYouTube(id,button){const p=data.projects.find(x=>x.id===id);if(!p||!p.video_url)return;if(!confirm('Publish “'+title(p)+'” to the connected YouTube channel? Google may keep uploads private until the API project passes its compliance audit.'))return;button.disabled=true;button.textContent='Checking YouTube…';$('#error').classList.remove('show');$('#success').classList.remove('show');try{const status=await api('/api/creatorthon/publishing/status');if(!status.platforms?.youtube?.configured)throw Error('YouTube publishing is not configured in Render.');button.textContent='Publishing to YouTube…';const tags=await api('/api/creatorthon/hashtags',{method:'POST',body:JSON.stringify({topic:p.topic||{title:title(p)}})}),caption=[title(p),p.topic?.summary||p.topic?.description||''].filter(Boolean).join('\n\n'),result=await api('/api/creatorthon/publish',{method:'POST',body:JSON.stringify({project_id:p.id,video_url:p.video_url,caption,hashtags:tags.hashtags||['#viralizer.ai'],platforms:['youtube']})}),youtube=result.results?.youtube;if(youtube?.status!=='published')throw Error(youtube?.detail||'YouTube could not publish this video.');const youtubeUrl=youtube.url||(youtube.id?'https://youtu.be/'+encodeURIComponent(youtube.id):'');button.textContent='Published to YouTube ✓';if(youtubeUrl){$('#success').innerHTML='Video published successfully. YouTube URL: <a href="'+esc(youtubeUrl)+'" target="_blank" rel="noopener">'+esc(youtubeUrl)+'</a>';$('#success').classList.add('show')}await refreshWorkspace();window.scrollTo({top:0,behavior:'smooth'})}catch(e){button.disabled=false;button.textContent='Publish to YouTube';$('#error').textContent=e.message;$('#error').classList.add('show');window.scrollTo({top:0,behavior:'smooth'})}}
async function deleteVideo(id){const p=data.projects.find(x=>x.id===id);if(!p||!confirm('Delete the finished video for “'+title(p)+'”? The editable project will remain, but the stored video cannot be recovered.'))return;try{await api('/api/creatorthon/projects/'+encodeURIComponent(id)+'/video',{method:'DELETE'});await refreshWorkspace()}catch(e){$('#error').textContent=e.message;$('#error').classList.add('show')}}
async function deleteProject(id){const p=data.projects.find(x=>x.id===id);if(!p||!confirm('Permanently delete “'+title(p)+'” and its video, reports, and saved assets? This cannot be undone.'))return;try{await api('/api/creatorthon/projects/'+encodeURIComponent(id),{method:'DELETE'});await refreshWorkspace()}catch(e){$('#error').textContent=e.message;$('#error').classList.add('show')}}
$$('.tab').forEach(b=>b.onclick=()=>{$$('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');render(b.dataset.view)});(async()=>{try{data=await api('/api/creatorthon/workspace');$('#welcome').textContent=(data.profile?.full_name?'Welcome back, '+data.profile.full_name+'. ':'')+'Your drafts, videos and reports are ready.';metrics();render()}catch(e){$('#error').textContent=e.message;$('#error').classList.add('show')}})();
</script></body></html>
