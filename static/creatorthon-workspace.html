<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Workspace · Viralizer</title><style>
:root{--ink:#111116;--muted:#71717a;--line:#e7e7ec;--soft:#f6f6f8;--violet:#8b2cff;--green:#39d990}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:#fafafd}button{font:inherit;cursor:pointer}.top{height:72px;border-bottom:1px solid var(--line);background:#fffc;backdrop-filter:blur(16px);display:flex;align-items:center;justify-content:space-between;padding:0 max(24px,calc((100vw - 1120px)/2));position:sticky;top:0;z-index:5}.top img{width:158px;display:block}.top nav{display:flex;gap:18px;align-items:center}.top a{color:#55545d;text-decoration:none;font-weight:750;font-size:14px}.create{padding:11px 16px!important;border-radius:12px;background:#111;color:#fff!important}main{width:min(1120px,calc(100% - 40px));margin:auto;padding:42px 0 80px}.eyebrow{color:var(--violet);font-size:12px;font-weight:900;letter-spacing:.12em}.hero{display:flex;align-items:end;justify-content:space-between;gap:24px;margin-bottom:30px}.hero h1{font-size:clamp(40px,5vw,62px);letter-spacing:-.055em;line-height:1;margin:9px 0}.hero p{color:var(--muted);margin:0}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:32px}.metric{padding:20px;border:1px solid var(--line);border-radius:18px;background:#fff}.metric strong{display:block;font-size:28px}.metric span{color:var(--muted);font-size:13px}.tabs{display:flex;gap:8px;margin-bottom:18px}.tab{padding:11px 15px;border:1px solid var(--line);border-radius:999px;background:#fff;font-weight:800}.tab.on{background:#111;color:#fff;border-color:#111}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{display:flex;flex-direction:column;min-height:270px;border:1px solid var(--line);border-radius:21px;overflow:hidden;background:#fff}.thumb{height:135px;background:linear-gradient(135deg,#18131f,#7b23d0);display:grid;place-items:center;color:#fff;font-size:42px}.thumb video{width:100%;height:100%;object-fit:cover;background:#000}.body{display:flex;flex:1;flex-direction:column;padding:18px}.status{align-self:start;padding:6px 9px;border-radius:99px;background:#f0e7ff;color:#7020ca;font-size:10px;font-weight:900;text-transform:uppercase}.body h2{font-size:18px;line-height:1.25;margin:13px 0 8px}.body p{color:var(--muted);font-size:13px;line-height:1.45;margin:0}.meta{margin-top:auto;padding-top:15px;color:#8a8990;font-size:11px}.actions{display:flex;gap:8px;margin-top:13px}.actions a,.actions button{flex:1;padding:10px;border:1px solid var(--line);border-radius:11px;background:#fff;color:#111;text-align:center;text-decoration:none;font-weight:800;font-size:12px}.actions .primary{background:#111;color:#fff}.actions .danger{border-color:#ffd3da;background:#fff5f6;color:#b4233d}.actions .danger:hover{background:#ffe8ec}.empty{grid-column:1/-1;padding:56px;border:1px dashed #d4d3dc;border-radius:22px;text-align:center;color:var(--muted)}.error{display:none;margin-bottom:20px;padding:14px;border-radius:12px;background:#fff0f2;color:#a21f39}.error.show{display:block}@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}.summary{grid-template-columns:1fr 1fr}}@media(max-width:560px){.top{padding:0 16px}.top img{width:135px}.top nav a:not(.create){display:none}main{width:calc(100% - 28px);padding-top:28px}.hero{display:block}.summary,.grid{grid-template-columns:1fr}.metric{padding:16px}}
</style></head><body><header class="top"><a href="/creatorthon-v3"><img src="/static/viralizer-logo-black.png" alt="Viralizer"></a><nav><a href="/creatorthon/concept">Create my concept</a><a href="/logout?next=/creatorthon-v3/login">Sign out</a><a class="create" href="/creatorthon-v3">+ Create new</a></nav></header><main><div id="error" class="error"></div><div class="hero"><div><span class="eyebrow">YOUR ACCOUNT</span><h1>My Workspace</h1><p id="welcome">Your drafts, videos and reports—saved in one place.</p></div></div><div id="summary" class="summary"></div><div class="tabs"><button class="tab on" data-view="projects">All projects</button><button class="tab" data-view="videos">My videos</button><button class="tab" data-view="drafts">Drafts</button><button class="tab" data-view="reports">Reports</button></div><section id="grid" class="grid"><div class="empty">Loading your workspace…</div></section></main><script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];let data={projects:[],reports:[],summary:{}},currentView='projects';const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const title=p=>p.title||p.topic?.title||p.topic?.topic||'Untitled project';const date=v=>v?new Date(v*1000).toLocaleString():'Recently';
async function api(url,options={}){const r=await fetch(url,{credentials:'same-origin',...options,headers:{'Content-Type':'application/json',...(options.headers||{})}}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||'Could not update your workspace.');return d}
function metrics(){const s=data.summary||{};$('#summary').innerHTML=[['Projects',s.projects||0],['Finished videos',s.completed_videos||0],['Drafts',s.drafts||0],['Reports',s.reports||0]].map(x=>'<div class="metric"><strong>'+x[1]+'</strong><span>'+x[0]+'</span></div>').join('')}
function projectCard(p){const video=p.video_url?'<video src="'+esc(p.video_url)+'" muted preload="metadata"></video>':'▶';const prompt=p.prompt?.text||p.prompt?.prompt||'';return '<article class="card"><div class="thumb">'+video+'</div><div class="body"><span class="status">'+esc(p.status||'draft')+'</span><h2>'+esc(title(p))+'</h2><p>'+esc(prompt||p.topic?.description||'Continue this saved creation when you are ready.')+'</p><div class="meta">'+esc(p.provider||'Provider not selected')+' · '+esc(date(p.updated_at))+'</div><div class="actions">'+(p.video_url?'<a class="primary" href="'+esc(p.video_url)+'" target="_blank">Watch video</a>':'<a class="primary" href="/creatorthon-v3?project='+esc(p.id)+'">Continue</a>')+'<button onclick="details(\''+esc(p.id)+'\')">Details</button></div><div class="actions">'+(p.video_url?'<button class="danger" onclick="deleteVideo(\''+esc(p.id)+'\')">Delete video</button>':'')+'<button class="danger" onclick="deleteProject(\''+esc(p.id)+'\')">Delete project</button></div></div></article>'}
function reportCard(r){const summary=typeof r.content?.summary==='string'?r.content.summary:(r.content?.core_message||'Saved topic research and production intelligence.');return '<article class="card"><div class="thumb">▤</div><div class="body"><span class="status">'+esc(r.report_type)+'</span><h2>'+esc(r.title)+'</h2><p>'+esc(summary)+'</p><div class="meta">'+esc(date(r.updated_at))+'</div><div class="actions">'+(r.source_url?'<a href="'+esc(r.source_url)+'" target="_blank" rel="noopener">Source</a>':'')+'<button class="primary" onclick="reportDetails(\''+esc(r.id)+'\')">Open report</button></div></div></article>'}
function render(view=currentView){currentView=view;let items=[];if(view==='reports')items=data.reports.map(reportCard);else{let projects=data.projects;if(view==='videos')projects=projects.filter(p=>p.video_url);if(view==='drafts')projects=projects.filter(p=>['draft','prepared'].includes(p.status));items=projects.map(projectCard)}$('#grid').innerHTML=items.join('')||'<div class="empty">Nothing saved here yet. Start a new creation and Viralizer will autosave it.</div>'}
function details(id){const p=data.projects.find(x=>x.id===id);if(!p)return;alert([title(p),'Status: '+p.status,'Provider: '+(p.provider||'Not selected'),'Prompt: '+(p.prompt?.text||p.prompt?.prompt||'Not prepared yet')].join('\n\n'))}function reportDetails(id){const r=data.reports.find(x=>x.id===id);if(r)alert(r.title+'\n\n'+JSON.stringify(r.content,null,2))}
async function refreshWorkspace(){data=await api('/api/creatorthon/workspace');metrics();render(currentView)}
async function deleteVideo(id){const p=data.projects.find(x=>x.id===id);if(!p||!confirm('Delete the finished video for “'+title(p)+'”? The editable project will remain, but the stored video cannot be recovered.'))return;try{await api('/api/creatorthon/projects/'+encodeURIComponent(id)+'/video',{method:'DELETE'});await refreshWorkspace()}catch(e){$('#error').textContent=e.message;$('#error').classList.add('show')}}
async function deleteProject(id){const p=data.projects.find(x=>x.id===id);if(!p||!confirm('Permanently delete “'+title(p)+'” and its video, reports, and saved assets? This cannot be undone.'))return;try{await api('/api/creatorthon/projects/'+encodeURIComponent(id),{method:'DELETE'});await refreshWorkspace()}catch(e){$('#error').textContent=e.message;$('#error').classList.add('show')}}
$$('.tab').forEach(b=>b.onclick=()=>{$$('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');render(b.dataset.view)});(async()=>{try{data=await api('/api/creatorthon/workspace');$('#welcome').textContent=(data.profile?.full_name?'Welcome back, '+data.profile.full_name+'. ':'')+'Your drafts, videos and reports are ready.';metrics();render()}catch(e){$('#error').textContent=e.message;$('#error').classList.add('show')}})();
</script></body></html>
