<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Growth Autopilot · Agent Control Center</title><style>
:root{--bg:#0d1117;--panel:#151b23;--panel2:#1b2430;--line:#2b3543;--text:#eef3f7;--muted:#8f9dab;--green:#53d18c;--amber:#f4bd59;--blue:#61a9ff;--red:#f07178}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,Segoe UI,system-ui,sans-serif}.app{min-height:100vh;display:grid;grid-template-columns:300px 1fr}.side{position:fixed;inset:0 auto 0 0;width:300px;background:#10161e;border-right:1px solid var(--line);display:flex;flex-direction:column}.logo{padding:24px;border-bottom:1px solid var(--line)}.logo b{font-size:17px}.logo small{display:block;color:var(--green);margin-top:5px}.side-head{padding:20px 18px 8px;display:flex;justify-content:space-between;align-items:center}.side-head span{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}button{font:inherit;cursor:pointer}.icon-btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:8px;padding:7px 10px}.runs{padding:8px;overflow:auto}.run{width:100%;border:1px solid transparent;background:transparent;color:var(--text);text-align:left;padding:13px;border-radius:10px;margin-bottom:5px}.run:hover,.run.active{background:var(--panel2);border-color:var(--line)}.run strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.run small{color:var(--muted);display:flex;justify-content:space-between;margin-top:7px}.side-foot{margin-top:auto;padding:16px 20px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}.main{grid-column:2;min-width:0}.top{height:70px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;background:#0d1117ed;backdrop-filter:blur(12px);z-index:5}.top strong{font-size:16px}.mode{padding:7px 10px;border-radius:999px;border:1px solid #385344;color:var(--green);font-size:11px;font-weight:700}.content{padding:28px;max-width:1400px;margin:auto}.empty{min-height:70vh;display:grid;place-items:center;text-align:center}.empty-inner{max-width:680px}.empty h1{font-size:43px;letter-spacing:-.04em;margin:12px 0}.empty p{color:var(--muted);font-size:16px;line-height:1.6}.actions{display:flex;gap:10px;justify-content:center;margin-top:24px}.btn{border:0;background:var(--green);color:#07130c;padding:11px 16px;border-radius:9px;font-weight:800}.btn.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}.btn:disabled{opacity:.45;cursor:not-allowed}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px}.grid{display:grid;gap:16px}.two{grid-template-columns:1fr 1fr}.field{margin-bottom:15px}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:#0f151d;color:var(--text);border-radius:8px;padding:11px}.field textarea{min-height:90px;resize:vertical}.modal{position:fixed;inset:0;background:#000a;display:none;place-items:center;z-index:20;padding:20px}.modal.open{display:grid}.modal-card{width:min(680px,100%);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modal h2{margin:0}.run-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:20px}.run-head h1{font-size:28px;margin:5px 0}.run-head p{color:var(--muted);margin:0}.status{display:inline-flex;gap:6px;align-items:center;padding:6px 9px;border-radius:999px;background:#273343;font-size:11px;font-weight:800;text-transform:uppercase}.status.succeeded{color:var(--green)}.status.running,.status.queued{color:var(--blue)}.status.waiting_user{color:var(--amber)}.status.failed,.status.dead_letter{color:var(--red)}.pipeline{display:grid;gap:10px}.step{display:grid;grid-template-columns:46px 1fr auto;gap:14px;align-items:center;padding:15px;background:var(--panel);border:1px solid var(--line);border-radius:12px}.agent{width:42px;height:42px;border-radius:11px;background:#22303c;display:grid;place-items:center;font-weight:900;color:var(--blue)}.step h3{margin:0 0 4px;font-size:14px}.step small{color:var(--muted)}.step-actions{display:flex;gap:8px}.details{margin-top:18px}.details h2{font-size:16px}.json{background:#0a0f15;border:1px solid var(--line);border-radius:10px;padding:14px;overflow:auto;max-height:300px;color:#b8c8d8;font:12px ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap}.selection{margin-top:18px}.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.choice{border:1px solid var(--line);background:var(--panel2);border-radius:11px;padding:15px}.choice h3{margin:0 0 8px}.choice p{color:var(--muted);font-size:12px;line-height:1.45}.choice .score{color:var(--green);font-weight:800}.notice{padding:12px;border:1px solid #554826;background:#2b2516;color:#f5cf7b;border-radius:10px;margin-bottom:16px}.toast{position:fixed;right:24px;bottom:24px;background:var(--text);color:#10161e;padding:11px 16px;border-radius:9px;font-weight:700;opacity:0;transform:translateY(30px);transition:.25s}.toast.show{opacity:1;transform:none}@media(max-width:850px){.app{display:block}.side{position:static;width:auto;height:auto}.runs{display:flex;overflow:auto}.run{min-width:230px}.main{grid-column:auto}.two{grid-template-columns:1fr}.step{grid-template-columns:42px 1fr}.step-actions{grid-column:2}.content{padding:18px}}
</style></head><body><div class="app"><aside class="side"><div class="logo"><b>Growth Autopilot</b><small>Agent Control Center</small></div><div class="side-head"><span>Workflow runs</span><button class="icon-btn" id="newBtn">＋</button></div><div class="runs" id="runs"><div style="padding:15px;color:var(--muted)">Loading runs…</div></div><div class="side-foot">Real database state · customer scoped<br>Provider calls disabled</div></aside><main class="main"><header class="top"><strong>Agentic work, decisions, and artifacts</strong><div style="display:flex;gap:8px"><span class="mode">SAFE / PROVIDER-FREE</span><button class="icon-btn" id="refreshBtn">Refresh</button><button class="icon-btn" id="tickBtn">Run queued work</button></div></header><div class="content" id="content"></div></main></div>
<div class="modal" id="brandModal"><div class="modal-card"><div class="modal-head"><h2>Confirm Brand Intelligence</h2><button class="icon-btn close">×</button></div><div class="two grid"><div class="field"><label>Customer type</label><select id="customerType"><option value="business">Business</option><option value="creator">Creator</option></select></div><div class="field"><label>Website URL (optional)</label><input id="websiteUrl" placeholder="https://example.com"></div></div><div class="field"><label>Positioning</label><textarea id="positioning" placeholder="What do you do, for whom, and why are you different?"></textarea></div><div class="two grid"><div class="field"><label>Voice (comma separated)</label><input id="voice" placeholder="clear, credible, bold"></div><div class="field"><label>Audience</label><input id="audience" placeholder="Founders, marketing leaders"></div></div><div class="field"><label>Goals</label><input id="goals" placeholder="Reach, qualified traffic, sales"></div><button class="btn" id="saveBrand">Confirm exact profile</button></div></div>
<div class="modal" id="objectiveModal"><div class="modal-card"><div class="modal-head"><h2>Create agent objective</h2><button class="icon-btn close">×</button></div><div class="field"><label>What outcome should the agents work toward?</label><textarea id="objective" placeholder="Create a YouTube Short campaign that explains our new product to first-time buyers."></textarea></div><div class="field"><label>Known signals or topics (one per line, optional)</label><textarea id="topics" placeholder="Paste customer questions, observed topics, or research signals. If empty, the agent creates clearly labeled local hypotheses."></textarea></div><div class="two grid"><div class="field"><label>Platform</label><select id="platform"><option value="youtube_shorts">YouTube Shorts</option><option value="instagram">Instagram</option><option value="tiktok">TikTok</option><option value="linkedin">LinkedIn</option></select></div><div class="field"><label>Goal</label><input id="goal" placeholder="Drive qualified website visits"></div></div><button class="btn" id="createObjective">Create workflow & queue A2</button></div></div><div class="toast" id="toast"></div>
<script>
const state={runs:[],selected:'',detail:null,brand:null};const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}}),t=await r.text();let d={};try{d=JSON.parse(t)}catch{}if(!r.ok)throw Error(d.detail||t||'Request failed');return d}function show(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}function parse(v){try{return JSON.parse(v||'{}')}catch{return {raw:v}}}function title(run){const i=parse(run.input_json);return i.objective||run.workflow_type}function fmt(ts){return ts?new Date(ts*1000).toLocaleString():'—'}
async function load(){const [runs,brand]=await Promise.all([api('/api/autopilot/control/runs'),api('/api/autopilot/brand-profile')]);state.runs=runs.runs;state.brand=brand.brand_profile;renderRuns();if(state.selected&&state.runs.some(r=>r.id===state.selected))await openRun(state.selected);else if(state.runs[0])await openRun(state.runs[0].id);else renderEmpty()}
function renderRuns(){$('#runs').innerHTML=state.runs.length?state.runs.map(r=>`<button class="run ${r.id===state.selected?'active':''}" data-run="${r.id}"><strong>${esc(title(r))}</strong><small><span>${esc(r.status)}</span><span>${r.step_count} tasks</span></small></button>`).join(''):'<div style="padding:15px;color:var(--muted)">No workflow runs yet.</div>';document.querySelectorAll('[data-run]').forEach(b=>b.onclick=()=>openRun(b.dataset.run))}
function renderEmpty(){$('#content').innerHTML=`<div class="empty"><div class="empty-inner"><div class="status running">Agent system ready</div><h1>Give the agents a real objective.</h1><p>The orchestrator will create durable tasks, workers will execute them, and every input, output, retry, decision, and human gate will be visible here.</p>${state.brand?'<div class="actions"><button class="btn" id="emptyNew">Create objective</button><button class="btn secondary" id="editBrand">Edit brand profile</button></div>':'<div class="notice">A confirmed brand profile is required before agents can begin.</div><div class="actions"><button class="btn" id="setupBrand">Set up brand intelligence</button></div>'}</div></div>`;$('#emptyNew')&&($('#emptyNew').onclick=()=>openModal('objectiveModal'));$('#editBrand')&&($('#editBrand').onclick=()=>openModal('brandModal'));$('#setupBrand')&&($('#setupBrand').onclick=()=>openModal('brandModal'))}
const labels={trend_discovery:'A2 · Trend Discovery',opportunity_ranking:'A3 · Opportunity Ranking',opportunity_selection:'Human · Select Opportunity',creative_direction:'A4 · Creative Director',concept_selection:'Human · Select Concept',production_planning:'A5 · Production Planning',production_provider:'Integration · PixVerse Required',publishing:'A6 · Publishing',growth_monitoring:'A7 · Growth Monitoring'};
const stageOrder={trend_discovery:20,opportunity_ranking:30,opportunity_selection:35,creative_direction:40,concept_selection:45,production_planning:50,production_provider:55,publishing:60,growth_monitoring:70};
async function openRun(id){state.selected=id;state.detail=await api('/api/autopilot/control/runs/'+id);renderRuns();renderDetail()}
function renderDetail(){const {run,steps}=state.detail,i=parse(run.input_json),ordered=[...steps].sort((a,b)=>(stageOrder[a.agent_type]||99)-(stageOrder[b.agent_type]||99));$('#content').innerHTML=`<div class="run-head"><div><span class="status ${run.status}">${esc(run.status)}</span><h1>${esc(i.objective||run.workflow_type)}</h1><p>Run ${run.id.slice(0,10)} · created ${fmt(run.created_at)}</p></div><button class="btn secondary" id="newTop">New objective</button></div><div class="pipeline">${ordered.map((s,n)=>`<article class="step"><div class="agent">${String(n+1).padStart(2,'0')}</div><div><h3>${esc(labels[s.agent_type]||s.agent_type)}</h3><small>${esc(s.status)} · attempt ${s.attempt}/${s.max_attempts} · ${fmt(s.updated_at)}</small></div><div class="step-actions"><button class="icon-btn" data-inspect="${s.id}">Inspect</button></div></article>`).join('')}</div><div id="stepPanel"></div>`;$('#newTop').onclick=()=>openModal('objectiveModal');document.querySelectorAll('[data-inspect]').forEach(b=>b.onclick=()=>inspect(b.dataset.inspect));const waiting=steps.find(s=>s.status==='waiting_user');if(waiting)inspect(waiting.id)}
function inspect(id){const s=state.detail.steps.find(x=>x.id===id),input=parse(s.input_json),output=parse(s.output_json),error=parse(s.error_json);let action='';if(s.status==='waiting_user'&&s.agent_type==='opportunity_selection'){const ids=input.opportunity_ids||[],rank=state.detail.steps.find(x=>x.agent_type==='opportunity_ranking'),items=(parse(rank?.output_json).opportunities||[]).filter(x=>ids.includes(x.id));action=`<div class="selection"><h2>Human decision required: choose one opportunity</h2><div class="choices">${items.map(x=>`<div class="choice"><span class="score">Score ${x.score}</span><h3>${esc(x.title)}</h3><p>${esc(x.rationale)}</p><button class="btn" data-select="opportunity_selection:${x.id}">Select</button></div>`).join('')}</div></div>`}if(s.status==='waiting_user'&&s.agent_type==='concept_selection'){const ids=input.concept_ids||[],creative=state.detail.steps.find(x=>x.agent_type==='creative_direction'),items=(parse(creative?.output_json).concepts||[]).filter(x=>ids.includes(x.id));action=`<div class="selection"><h2>Human decision required: choose one concept</h2><div class="choices">${items.map(x=>`<div class="choice"><h3>${esc(x.name)}</h3><p>${esc(x.content?.hook||'')}</p><button class="btn" data-select="concept_selection:${x.id}">Select</button></div>`).join('')}</div></div>`}if(s.status==='waiting_user'&&s.agent_type==='production_provider')action=`<div class="notice">The orchestration reached the PixVerse boundary and stopped safely. Connect the provider later or attach a reviewed local asset.</div>`;$('#stepPanel').innerHTML=`<div class="details grid two"><div class="card"><h2>Task input</h2><pre class="json">${esc(JSON.stringify(input,null,2))}</pre></div><div class="card"><h2>Task output / error</h2><pre class="json">${esc(JSON.stringify(Object.keys(error).length?error:output,null,2))}</pre></div></div>${action}`;document.querySelectorAll('[data-select]').forEach(b=>b.onclick=async()=>{const [type,entity_id]=b.dataset.select.split(':');await api(`/api/autopilot/control/runs/${state.selected}/select/${type}`,{method:'POST',body:JSON.stringify({entity_id})});show('Decision recorded; next agent queued');await runWork()})}
function openModal(id){$('#'+id).classList.add('open')}document.querySelectorAll('.close').forEach(b=>b.onclick=()=>b.closest('.modal').classList.remove('open'));$('#newBtn').onclick=()=>state.brand?openModal('objectiveModal'):openModal('brandModal');$('#refreshBtn').onclick=load;
$('#saveBrand').onclick=async()=>{await api('/api/autopilot/brand-profile',{method:'PUT',body:JSON.stringify({customer_type:$('#customerType').value,website_url:$('#websiteUrl').value,voice:$('#voice').value.split(',').map(x=>x.trim()).filter(Boolean),positioning:$('#positioning').value,audiences:$('#audience').value.split(',').map(x=>x.trim()).filter(Boolean),goals:$('#goals').value.split(',').map(x=>x.trim()).filter(Boolean),products_services:[],visual_style:[],constraints:['Never publish without exact-content approval.'],social_urls:[],confirmed:true})});$('#brandModal').classList.remove('open');show('Brand profile confirmed');await load()};
$('#createObjective').onclick=async()=>{const objective=$('#objective').value.trim();if(!objective)return show('Objective is required');const d=await api('/api/autopilot/control/objectives',{method:'POST',body:JSON.stringify({objective,seed_topics:$('#topics').value.split('\n').map(x=>x.trim()).filter(Boolean),platform:$('#platform').value,goal:$('#goal').value})});$('#objectiveModal').classList.remove('open');state.selected=d.run.id;show('Workflow created; Trend Discovery queued');await runWork()};async function runWork(){await api('/api/autopilot/control/tick',{method:'POST'});await load()}$('#tickBtn').onclick=runWork;load().catch(e=>{$('#content').innerHTML=`<div class="notice">${esc(e.message)}</div>`});
</script></body></html>
