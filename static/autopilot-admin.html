<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Autopilot Operations · Viralizer</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#17131c;background:#f7f4fa}*{box-sizing:border-box}body{margin:0}header{display:flex;justify-content:space-between;align-items:center;padding:20px 5vw;background:#17131c;color:#fff}header a{color:#d9b8ff}main{width:min(1180px,90vw);margin:36px auto}.head{display:flex;justify-content:space-between;align-items:end;gap:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin:24px 0}.card,.item{padding:20px;border:1px solid #ded5e5;border-radius:18px;background:#fff}.card strong{display:block;font-size:30px}.card span,.item small{color:#746b79}.items{display:grid;gap:12px}.item{display:grid;grid-template-columns:1fr auto;gap:16px}.item h3{margin:4px 0}.item pre{max-height:100px;overflow:auto;white-space:pre-wrap;color:#6d6371}button{min-height:42px;padding:0 16px;border:0;border-radius:11px;background:#771fd2;color:#fff;font-weight:800}button.secondary{background:#eee7f3;color:#4d335d}.danger{border-color:#efc5ca}.danger button{background:#a51d35}.notice{padding:13px;border-radius:12px;background:#efe5fa;color:#552278}.empty{text-align:center;color:#746b79}</style></head><body>
<header><strong>Viralizer · Autopilot Operations</strong><a href="/admin">← Admin home</a></header><main><div class="head"><div><small>WORKFLOW CONTROL</small><h1>Operations and recovery</h1><p>Inspect queue health, retry failed work, and preview retention safely.</p></div><button id="refresh">Refresh</button></div><div id="message" class="notice">Loading operational state…</div><div id="summary" class="grid"></div><h2>Action required</h2><div id="actions" class="items"></div><h2>Retention</h2><div id="retention" class="item danger"></div></main><script>
const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,options={}){const response=await fetch(url,{...options,headers:{'Content-Type':'application/json',...(options.headers||{})}}),text=await response.text();let data={};try{data=JSON.parse(text)}catch{}if(!response.ok)throw Error(data.detail||'Request failed');return data}
async function load(){try{const [status,required,retention]=await Promise.all([api('/api/admin/autopilot/operations'),api('/api/admin/autopilot/action-required'),api('/api/admin/autopilot/retention-preview')]);$('#summary').innerHTML='<div class="card"><span>Queued steps</span><strong>'+esc(status.workflow_steps.queued||0)+'</strong></div><div class="card"><span>Retry wait</span><strong>'+esc(status.workflow_steps.retry_wait||0)+'</strong></div><div class="card"><span>Dead letters</span><strong>'+esc(status.workflow_steps.dead_letter||0)+'</strong></div><div class="card"><span>Failed webhooks</span><strong>'+esc(status.webhooks.failed||0)+'</strong></div><div class="card"><span>Metrics due</span><strong>'+esc(status.metrics_due||0)+'</strong></div><div class="card"><span>Provider mode</span><strong>'+esc(status.provider_mode)+'</strong></div>';const rows=[...(required.steps||[]).map(x=>({...x,kind:'step'})),...(required.webhooks||[]).map(x=>({...x,kind:'webhook'}))];$('#actions').innerHTML=rows.length?rows.map(x=>'<article class="item"><div><small>'+esc(x.kind)+' · '+esc(x.status)+'</small><h3>'+esc(x.agent_type||x.provider||x.id)+'</h3><pre>'+esc(x.error_json||'{}')+'</pre></div><button data-retry="'+esc(x.kind)+':'+esc(x.id)+'">Retry</button></article>').join(''):'<div class="item empty">No failed or dead-letter work.</div>';document.querySelectorAll('[data-retry]').forEach(button=>button.onclick=async()=>{const [kind,id]=button.dataset.retry.split(':');button.disabled=true;try{await api('/api/admin/autopilot/retry/'+kind+'/'+encodeURIComponent(id),{method:'POST'});await load()}catch(error){$('#message').textContent=error.message;button.disabled=false}});$('#retention').innerHTML='<div><small>Dry-run preview</small><h3>'+esc(retention.webhook_events)+' webhook events and '+esc(retention.audit_events)+' audit events eligible</h3><p>Application requires an exact confirmation before deletion.</p></div><button id="applyRetention">Apply retention</button>';$('#applyRetention').onclick=async()=>{if(prompt('Type APPLY RETENTION to permanently remove only expired records.')!=='APPLY RETENTION')return;await api('/api/admin/autopilot/retention-apply',{method:'POST',body:JSON.stringify({confirmation:'APPLY RETENTION'})});await load()};$('#message').textContent='Operational state refreshed.'}catch(error){$('#message').textContent=error.message}}
$('#refresh').onclick=load;load();
</script></body></html>
